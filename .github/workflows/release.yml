name: Release

on:
  push:
    tags:
      - "[0-9]*.[0-9]*.[0-9]*"

permissions:
  attestations: write
  artifact-metadata: write
  contents: write
  id-token: write

jobs:
  release:
    environment: visual-review
    runs-on: ubuntu-latest
    steps:
      - name: Check out tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: npm
          node-version: 24

      - name: Use declared npm version
        run: npm install --global npm@10.9.2 && test "$(npm --version)" = "10.9.2"

      - name: Install dependencies
        run: npm ci && npm ls vite vitest esbuild --all

      - name: Verify version
        run: node -e 'if (require("./manifest.json").version !== process.env.GITHUB_REF_NAME) process.exit(1)'

      - name: Check and build
        run: npm run check

      - name: Verify and fetch paired Kami Reader theme
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, readFileSync, writeFileSync } from "node:fs";
          const { themeDependency } = JSON.parse(readFileSync("./visual-evidence/macos/manifest.json", "utf8"));
          const response = await fetch(
            `https://raw.githubusercontent.com/${themeDependency.repository}/${themeDependency.tag}/${themeDependency.asset}`
          );
          if (!response.ok) throw new Error(`theme download failed: ${response.status}`);
          mkdirSync(".visual-dependencies", { recursive: true });
          writeFileSync(".visual-dependencies/theme.css", Buffer.from(await response.arrayBuffer()));
          NODE

      - name: Verify reviewed visual matrix
        env:
          KAMI_VISUAL_THEME_CSS: .visual-dependencies/theme.css
        run: npm run check:visual

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          main.js manifest.json styles.css
          --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
